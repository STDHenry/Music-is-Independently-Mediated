<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Independence City</title>
    <style>
        /* Làm cho toàn bộ màn hình của file trung gian trong suốt nhưng vẫn nhận được lượt click */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- XÓA BỎ DÒNG LINK GOOGLE DRIVE CŨ NÀY BẰNG CÁCH THAY THẾ NÓ -->
<audio id="bg-music" src="nhacnen.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bg-music');

        function playAudio() {
            audio.play().then(() => {
                console.log("Nhạc đang phát ngầm thành công!");
                // Khi đã phát thành công, gỡ bỏ sự kiện để tránh tốn tài nguyên
                window.removeEventListener('click', playAudio);
                window.parent.document.removeEventListener('click', playAudio);
            }).catch(err => console.log("Chờ người dùng tương tác..."));
        }

        // Kích hoạt phát nhạc khi có bất kỳ tương tác nào từ chính iframe hoặc từ trang mẹ Chess.com
        window.addEventListener('click', playAudio);
        window.addEventListener('DOMContentLoaded', playAudio);
        
        try {
            // Ép nghe sự kiện click từ trang Chess.com bên ngoài đổ vào iframe ẩn
            window.parent.document.addEventListener('click', playAudio);
            window.parent.document.addEventListener('keydown', playAudio);
        } catch(e) {
            console.log("Cấu hình bảo mật chặn nhẹ mã chéo, đừng lo lắng.");
        }
    </script>
</body>
</html>
